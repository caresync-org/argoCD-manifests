global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend caresync_http
    bind *:80
    default_backend k8s_workers

backend k8s_workers
    balance roundrobin
    option tcp-check
    server worker1 <WORKER1-PRIVATE-IP>:30080 check
    server worker2 <WORKER2-PRIVATE-IP>:30080 check

# =============================================================================
# INSTRUCTIONS:
# Replace <WORKER1-PRIVATE-IP> and <WORKER2-PRIVATE-IP> with actual IPs
# Example:
#   server worker1 10.0.1.101:30080 check
#   server worker2 10.0.1.102:30080 check
#
# Then apply:
#   sudo cp setup/haproxy.cfg /etc/haproxy/haproxy.cfg
#   sudo haproxy -c -f /etc/haproxy/haproxy.cfg    # validate config
#   sudo systemctl restart haproxy
#   sudo systemctl enable haproxy
# =============================================================================
