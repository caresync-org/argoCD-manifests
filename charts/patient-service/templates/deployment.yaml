apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: patient-service
spec:
  replicas: {{ .Values.patient.replicaCount }}
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: patient-service
          image: "{{ .Values.global.organization }}/{{ .Values.patient.image.repository }}:{{ .Values.patient.image.tag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          ports:
            - containerPort: {{ .Values.patient.service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          envFrom:
            - configMapRef:
                name: patient-service-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: patient-secret
                  key: mongoUri
          resources:
            requests:
              cpu: {{ .Values.patient.resources.requests.cpu }}
              memory: {{ .Values.patient.resources.requests.memory }}
            limits:
              cpu: {{ .Values.patient.resources.limits.cpu }}
              memory: {{ .Values.patient.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.patient.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.patient.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
