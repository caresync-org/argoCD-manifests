apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: appointment-service
spec:
  type: ClusterIP
  selector:
    app: appointment-service
  ports:
    - port: {{ .Values.appointment.service.port }}
      targetPort: {{ .Values.appointment.service.port }}
      protocol: TCP
