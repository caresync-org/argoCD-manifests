# ── Frontend ServiceAccount + Role + RoleBinding ──────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.frontend.name }}-sa
  namespace: {{ .Values.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.frontend.name }}-role
  namespace: {{ .Values.global.namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.frontend.name }}-rolebinding
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.frontend.name }}-sa
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: {{ .Values.frontend.name }}-role
  apiGroup: rbac.authorization.k8s.io
---
