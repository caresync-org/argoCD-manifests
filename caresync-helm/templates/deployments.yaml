# ── Auth Service Deployment ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.auth.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.auth.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.auth.name }}
    spec:
      serviceAccountName: {{ .Values.auth.name }}-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-auth-mongodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ .Values.authMongodb.name }} {{ .Values.authMongodb.port }}; do echo waiting for auth-mongodb; sleep 3; done
      containers:
        - name: auth-service
          image: {{ .Values.images.repository }}/{{ .Values.auth.image }}:{{ .Values.auth.tag }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.auth.port }}
          env:
            - name: PORT
              value: "{{ .Values.auth.port }}"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: caresync-config
                  key: NODE_ENV
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: caresync-config
                  key: AUTH_MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: caresync-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: {{ .Values.auth.resources.requests.cpu }}
              memory: {{ .Values.auth.resources.requests.memory }}
            limits:
              cpu: {{ .Values.auth.resources.limits.cpu }}
              memory: {{ .Values.auth.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.auth.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.auth.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
