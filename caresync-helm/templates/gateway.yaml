---
# ── Gateway: NodePort proxy config (kgateway) ─────────────────────────────────

---
# ── Gateway Resource ──────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      port: {{ .Values.gateway.port }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# ── Frontend Route ────────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: caresync-frontend-route
  namespace: {{ .Values.global.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.global.namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.frontend.name }}-service
          port: {{ .Values.frontend.port }}
          weight: 1
---
# ── Auth Route ────────────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
