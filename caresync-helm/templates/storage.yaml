# ── Auth MongoDB PVC (Dynamic NFS) ───────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caresync-auth-mongodb-{{ .Values.global.environment }}-pvc
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.authMongodb.storage }}
  storageClassName: {{ .Values.authMongodb.storageClassName }}
---
