# ── Auth MongoDB StatefulSet ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.authMongodb.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.authMongodb.name }}
  serviceName: {{ .Values.authMongodb.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.authMongodb.name }}
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.authMongodb.image }}:{{ .Values.authMongodb.tag }}
          ports:
            - containerPort: {{ .Values.authMongodb.port }}
          volumeMounts:
            - name: auth-mongo-storage
              mountPath: /data/db
          resources:
            requests:
              cpu: {{ .Values.authMongodb.resources.requests.cpu }}
              memory: {{ .Values.authMongodb.resources.requests.memory }}
            limits:
              cpu: {{ .Values.authMongodb.resources.limits.cpu }}
              memory: {{ .Values.authMongodb.resources.limits.memory }}
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: auth-mongo-storage
          persistentVolumeClaim:
            claimName: caresync-auth-mongodb-{{ .Values.global.environment }}-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.authMongodb.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: {{ .Values.authMongodb.name }}
  ports:
    - port: {{ .Values.authMongodb.port }}
      targetPort: {{ .Values.authMongodb.port }}
  clusterIP: None
---
