# ── Frontend Network Policy ───────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: caresync-frontend-netpol
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.auth.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.auth.port }}
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.patient.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.patient.port }}
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.doctor.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.doctor.port }}
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.appointment.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.appointment.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ── Auth Network Policy ───────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: caresync-auth-netpol
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.auth.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.frontend.name }}
        - podSelector:
            matchLabels:
              app: {{ .Values.patient.name }}
        - podSelector:
            matchLabels:
              app: {{ .Values.doctor.name }}
        - podSelector:
            matchLabels:
              app: {{ .Values.appointment.name }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kgateway-system
      ports:
        - protocol: TCP
          port: {{ .Values.auth.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.authMongodb.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.authMongodb.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
