apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caresync-prod
  namespace: argocd
  labels:
    environment: production
    project: caresync
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: default
  source:
    repoURL: https://github.com/caresync-org/argoCD-manifests.git
    targetRevision: production
    path: caresync-helm
    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: caresync-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
